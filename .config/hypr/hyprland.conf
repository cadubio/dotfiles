
#autogenerated = 1 # remove this line to remove the warning

# See https://wiki.hyprland.org/Configuring/Monitors/
#monitor=,preferred,auto,1
monitor=HDMI-A-2,1920x1080@60,0x0,1
#wsbind=5,HDMI-A-2

monitor=eDP-1,1366x768@60.002998,1920x188,1
workspace=1,monitor:eDP-1, default:true

# See https://wiki.hyprland.org/Configuring/Keywords/ for more

# Inicialização
$gnome-schema = org.gnome.desktop.interface

exec = gsettings set $gnome-schema gtk-theme 'Arc-Dark'
exec = gsettings set $gnome-schema icon-theme 'Arc-Dark'
exec = gsettings set $gnome-schema cursor-theme 'Arc-Dark'
exec = gsettings set $gnome-schema font-name 'Cantarell 11'

#env = HYPRCURSOR_THEME,HyprBibataModernClassicSVG
#env = HYPRCURSOR_SIZE,24

exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY SWAYSOCK
exec-once = systemctl --user import-environment DISPLAY WAYLAND_DISPLAY
exec-once=/usr/lib/polkit-kde-authentification-agent-1
exec-once = dunst
exec-once = easyeffects --gapplication-service
#exec-once = waybar --config ~/.config/waybar/config.hyprland --style ~/.config/waybar/style-hyprland.css
exec-once = systemd-cat --stderr-priority=warning --identifier=gammastep gammastep
exec-once = wl-paste -t text --watch clipman store
exec-once = ags
exec-once = megasync
exec-once = swayosd-server
# exec-once = eww --config .config/eww open bar
# exec-once = eww --config .config/eww daemon
# exec-once = $HOME/.local/bin/bateriaCritica.sh
exec-once = ags --bus-name batCritica --config $HOME/.config/ags/windows/bateria_critica.js

# Posição dos Monitores
exec-once = kanshi

# Habilita o menu de desligamento
exec-once = $HOME/.local/bin/menuSair.sh

# Mensageiros no workspace special
windowrulev2 = workspace special:mensageiros silent,class:firefox
exec-once =  $HOME/.local/bin/mensageirosFF

exec-once = hypridle


# Source a file (multi-file configs)
# source = ~/.config/hypr/myColors.conf

# For all categories, see https://wiki.hyprland.org/Configuring/Variables/
input {
    kb_layout = br
    kb_variant =
    kb_model = thinkpad
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
	    disable_while_typing = true
        drag_lock = true
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    gaps_in = 5
    gaps_out = 5
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
    # cursor_inactive_timeout = 10
}

# see https://wiki.hyprland.org/Configuring/Variables/#cursor
cursor {
    inactive_timeout = 10
    zoom_factor = 1.0
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 10
#    blur = yes
#    blur_size = 3
#    blur_passes = 1
#    blur_new_optimizations = on

    drop_shadow = yes
    shadow_range = 4
    shadow_render_power = 3
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes

    # Some default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    animation = specialWorkspace, 1, 3, default, slidevert
}

dwindle {
    # See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
    pseudotile = true # master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # you probably want this
}

# master {
#     # See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
#     new_status = master
# }

gestures {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more
    workspace_swipe = true
}

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#executing for more
device {
  name = epic mouse V1
  sensitivity = -0.5
}

misc {
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    disable_autoreload = true
    
}

debug {
    disable_logs = false
}

# Example windowrule v1
# windowrule = float, ^(kitty)$
# Example windowrule v2
# # windowrulev2 = float,class:^(kitty)$,title:^(kitty)$
# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
windowrulev2 = float, title: ^(Plot Zoom)$
windowrulev2 = float, class: ^(file-roller)$
#windowrulev2 = float, title: ^(Firefox - Indicador de compartilhamento)$
#windowrulev2 = float, title:Firefox - Indicador de compartilhamento
windowrulev2 = float, class:firefox,title:.*(Indicador de compartilhamento).*
windowrulev2 = float, class:firefox,title:^(.*Tramitação.*)$
windowrulev2 = float, class:firefox,title:^(Nova nota de texto — Okular)$
windowrulev2 = float, class:firefox,title:^(.*Importação de texto.*)$
windowrulev2 = float, class:pavucontrol
windowrulev2 = size 654 540, class:pavucontrol
windowrulev2 = float, title:ImportPhotos
windowrulev2 = float, class:blueman-manager
windowrulev2 = move center, class:blueman-manager
windowrulev2 = float, title:Abrir a Pasta
windowrulev2 = float, title:rofi - dmenu
windowrulev2 = float, title:Abrir o Arquivo
#windowrulev2 = workspace special:megasync silent,class:nz.co.mega.megasync
windowrulev2 = float, class: nz.co.mega.megasync
# Float janelas pcmanfm
windowrulev2 = float, size 806 411, class:wdisplays
windowrulev2 = float, title: Transferencia de Arquivo Bluetooth
windowrulev2 = float, title: Confirme para substituir os arquivos
windowrulev2 = float, title: Mover arquivos
windowrulev2 = float, title: Deletar Arquivos
windowrulev2 = size 800 600, class:mpv
windowrulev2 = float, class: com.github.wwmm.easyeffects
windowrulev2 = float, title: .*(Editor de).*
#windowrulev2 = move 0 0,title:^(flameshot)
#windowrulev2 = fullscreen,0,title:^(flameshot)
windowrulev2 = float, class: com.gabm.satty
windowrulev2 = float, title:^(Secure CRAN mirrors)
windowrulev2 = float, class: io.github.kaii_lb.Overskride

# See https://wiki.hyprland.org/Configuring/Keywords/ for more
$mainMod = SUPER

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = , F1, exec, cat $HOME/.config/meus_atalhoss.txt | wofi -dmenu -m -p "Atalhos"
bind = SUPER_SHIFT, space, togglefloating,
bind = $mainMod, Q, exec, alacritty
bind = SUPER_SHIFT, C, killactive, 
bind = $mainMod, n, exec, firefox
bind = $mainMod, V, exec, clipman pick --tool wofi -T'--prompt="" -i --style=$HOME/.config/wofi/dracula.css'
bind = $mainMod, D, exec, wofi --show=drun -I --prompt="" -i --style=$HOME/.config/wofi/dracula.css
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle
bind = $mainMod, G, togglegroup, #dwindle
bind = $mainMod, F, exec, caja
bind =, XF86Display, exec, wdisplays
bind = $mainMod, C, exec, wofi-calc
bind = $mainMod, Z, exec, hyprpicker --autocopy --format=hex 
bind = $mainMod, T, exec, todofi.sh
bind = $mainMod SHIFT, F, exec, $HOME/.config/rofi/scripts/rofi-file-selector/rofi-file-selector.sh 
bind = CTRL SHIFT, BACKSPACE, exec, pkill --signal=SIGINT wf-recorder
#bind = $mainMod SHIFT, G, exec, eww open win_wfRecorder
bind = $mainMod SHIFT, G, exec, ags --bus-name record --config $HOME/.config/ags/windows/screen_record/main_captura.js
bind = $mainMod, Print, exec, flameshot gui

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move focus with mainMod + arrow keys
bind = $mainMod SHIFT, left, changegroupactive, b
bind = $mainMod SHIFT, right, changegroupactive, f

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Tela cheia
bind = $mainMod, W, fullscreen, 0

# Special workspace (scratchpad)
bind=$mainMod,A,togglespecialworkspace,mensageiros
#bind=$mainMod,M,togglespecialworkspace,megasync
bind=$mainMod SHIFT,minus,movetoworkspace,padrao
bind=$mainMod,minus,togglespecialworkspace,padrao

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Ajusta o Brilho do monitor
#bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
#bind = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
bind=, XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bind=, XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Volume áudio
#binde=, XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
#binde=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
#bind=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle
#bind=, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle
binde=, XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
binde=, XF86AudioLowerVolume, exec, swayosd-client --output-volume lower 
bind=, XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bind=, XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle

# take a screenshot
#bind=,Print,exec,grim -g "$(slurp)" /home/cadu/captura/captura-`date +%Y-%m-%d_%H-%M-%S`.jpg && dunstify "Copiando..." "Imagem salva na pasta captura" -i camera-photo-symbolic.symbolic --urgency=normal
#binde=,Print,exec,grim -g "$(slurp -o -r -c 'ff0000ff')" - | satty --filename - --fullscreen --output-filename /home/cadu/captura/satty.jpg
bind=,Print,exec,grim -g "$(slurp -o -r -c 'ff0000ff')" - | satty --filename - --fullscreen --output-filename /home/cadu/captura/satty-`date +%Y-%m-%d_%H-%M-%S`.png

bind=CTRL SHIFT, Print, exec, grim /home/cadu/captura/captura-`date +%Y-%m-%d_%H-%M-%S`.jpg && dunstify "Copiando..." "Imagem salva na pasta captura" -i camera-photo-symbolic.symbolic --urgency=normal

# take a screenshot and copy to clipboard
bind= SHIFT, Print, exec, grim -g "$(slurp)" - | wl-copy && dunstify "Copiando..." "Imagem salva na área de transferência" -i camera-photo-symbolic.symbolic --urgency=normal

bind = , XF86Favorites, exec, wofi-pass

bind=,XF86PowerOff,  exec, ags --bus-name powerMenu --config $HOME/.config/ags/windows/power_menu.js

# Exit 
bind=$mainMod,X,submap,sair

submap = sair

binde =, l, exit
binde =, r, exec, systemctl reboot
binde =, d, exec, systemctl poweroff

# bind =, escape, exec, ags --bus-name powerMenu --quit
bind =, escape, submap, reset

submap = reset

# Resize
bind=ALT,R,submap,resize 

submap=resize 

binde=,right,resizeactive,10 0
binde=,left,resizeactive,-10 0
binde=,up,resizeactive,0 -10
binde=,down,resizeactive,0 10

bind=,escape,submap,reset 

submap=reset 

