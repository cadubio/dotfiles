windowrule = float, class:firefox,title:.*(Indicador de compartilhamento).*
windowrule = float, class:firefox,title:^(.*Tramitação.*)$
windowrule = float, class:firefox,title:^(Nova nota de texto — Okular)$
windowrule = float, class:firefox,title:^(.*Importação de texto.*)$
windowrule = float, class:org.pulseaudio.pavucontrol
windowrule = size 654 540, class:org.pulseaudio.pavucontrol
windowrule = float, title:ImportPhotos
windowrule = float, class:blueman-manager
windowrule = move center, class:blueman-manager
windowrule = float, title:Abrir a Pasta
windowrule = float, title:rofi - dmenu
windowrule = float, title:Abrir o Arquivo
#windowrulev2 = workspace special:megasync silent,class:nz.co.mega.megasync
windowrule = float, class: MEGAsync
# Float janelas pcmanfm
windowrule = float, size 806 411, class:wdisplays
windowrule = float, title: Transferencia de Arquivo Bluetooth
windowrule = float, title: Confirme para substituir os arquivos
windowrule = float, title: Mover arquivos
windowrule = float, title: Deletar Arquivos
windowrule = size 800 600, class:mpv
windowrule = float, class: com.github.wwmm.easyeffects
windowrule = float, title: .*(Editor de).*
